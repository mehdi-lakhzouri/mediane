name: Repository features
description: >-
  Detects which GitHub security features this repository can use, so the same
  workflows run on a private repository today and light up everything once it
  is public (or has GitHub Advanced Security).

inputs:
  ghas-enabled:
    description: Value of the GHAS_ENABLED repository variable ('true' when a private repo has GHAS)
    default: "false"

outputs:
  public:
    description: "'true' when the repository is public"
    value: ${{ steps.detect.outputs.public }}
  code-scanning:
    description: "'true' when Code scanning and CodeQL are available"
    value: ${{ steps.detect.outputs.code-scanning }}
  dependency-graph:
    description: "'true' when the dependency graph is enabled (needed by dependency review)"
    value: ${{ steps.detect.outputs.dependency-graph }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GHAS_ENABLED: ${{ inputs.ghas-enabled }}
      run: |
        visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
        public=false
        [ "$visibility" = public ] && public=true
        code_scanning="$public"
        [ "$GHAS_ENABLED" = true ] && code_scanning=true
        # A repository setting of its own (Settings > Code security > Dependency graph).
        dependency_graph=false
        if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent 2>/dev/null; then
          dependency_graph=true
        fi
        echo "public=$public" >> "$GITHUB_OUTPUT"
        echo "code-scanning=$code_scanning" >> "$GITHUB_OUTPUT"
        echo "dependency-graph=$dependency_graph" >> "$GITHUB_OUTPUT"
        echo "Repository is $visibility: code scanning=$code_scanning, dependency graph=$dependency_graph, public supply-chain signing=$public"
