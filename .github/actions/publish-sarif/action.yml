name: Publish SARIF
description: >-
  Sends a SARIF report to Code scanning when the repository has it (public, or
  GitHub Advanced Security enabled), and always keeps it as a workflow artifact
  with a findings summary on the job page, so private repositories lose nothing.

inputs:
  sarif-file:
    description: Path to the SARIF report
    required: true
  category:
    description: Code scanning category, also used to name the artifact
    required: true
  code-scanning:
    description: "'true' when Code scanning is available (see the repo job of each workflow)"
    required: true

runs:
  using: composite
  steps:
    - name: Upload to Code scanning
      if: inputs.code-scanning == 'true' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: ${{ inputs.category }}

    - name: Summarize findings
      if: hashFiles(inputs.sarif-file) != ''
      shell: python3 {0}
      env:
        SARIF_FILE: ${{ inputs.sarif-file }}
        CATEGORY: ${{ inputs.category }}
      run: |
        import json, os
        from collections import Counter
        runs = json.load(open(os.environ["SARIF_FILE"], encoding="utf-8")).get("runs", [])
        results = [(run, r) for run in runs for r in run.get("results", [])]
        levels = Counter(r.get("level", "warning") for _, r in results)
        lines = [f"### {os.environ['CATEGORY']}: {len(results)} finding(s)", ""]
        if results:
            lines += [" · ".join(f"**{k}**: {v}" for k, v in sorted(levels.items())), "",
                      "| Level | Rule | Location |", "|---|---|---|"]
            for _, r in results[:50]:
                loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                path = loc.get("artifactLocation", {}).get("uri", "")
                line = loc.get("region", {}).get("startLine", "")
                lines.append(f"| {r.get('level', 'warning')} | {r.get('ruleId', '')} | `{path}:{line}` |")
            if len(results) > 50:
                lines.append(f"| … | {len(results) - 50} more in the artifact | |")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
            fh.write("\n".join(lines) + "\n\n")

    - name: Keep the report
      if: hashFiles(inputs.sarif-file) != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-${{ inputs.category }}
        path: ${{ inputs.sarif-file }}
        retention-days: 30
