name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Pipeline changes re-run everything they could affect.
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.node-version'
            backend:
              - *ci
              - 'backend/**'
            frontend:
              - *ci
              - 'frontend/**'
              - 'backend/**'
            mobile:
              - *ci
              - 'driver_health_app/**'

  backend:
    name: Backend (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: cabinguard_test
          POSTGRES_USER: cabinguard
          POSTGRES_PASSWORD: cabinguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cabinguard -d cabinguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway database of this job only; backend/test/setup-env.ts reads it.
      TEST_DATABASE_URL: postgresql://cabinguard:cabinguard@127.0.0.1:5432/cabinguard_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend

      - run: npm run lint:ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit tests with coverage
        run: |
          set -o pipefail
          npm run test:cov -- --ci --coverageReporters=lcov --coverageReporters=text-summary \
            | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '### Backend unit test coverage'
            echo '```'
            sed -n '/Coverage summary/,/^=\+$/p' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

      - name: Apply migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: E2E tests (real PostgreSQL)
        run: npm run test:e2e -- --ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - name: API client unit check
        working-directory: frontend/apps/web
        run: node e2e/client-refresh.test.ts
      - name: Prettier (advisory until the codebase is formatted)
        run: pnpm format:check || echo "::warning title=Prettier::frontend files are not formatted; run 'pnpm format' in frontend/"

  mobile:
    name: Mobile (format, analyze, tests)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: driver_health_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage --exclude-tags promo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-coverage
          path: driver_health_app/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  e2e-playwright:
    name: Web E2E (Playwright)
    needs: [changes, backend, frontend]
    # Runs when backend/frontend passed or were skipped (a skipped need would
    # otherwise skip this job too, e.g. on a frontend-only PR).
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: cabinguard_e2e
          POSTGRES_USER: cabinguard
          POSTGRES_PASSWORD: cabinguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cabinguard -d cabinguard_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ["1025:1025"]
    env:
      ADMIN_EMAIL: e2e-admin@cabinguard.test
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate ephemeral secrets
        run: |
          # Fresh for every run and masked in the logs: nothing is stored in the repository.
          for name in JWT_ACCESS_SECRET TOKEN_HASH_SECRET ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          mfa_key="$(openssl rand -base64 32)"
          echo "::add-mask::$mfa_key"
          echo "MFA_ENCRYPTION_KEY=$mfa_key" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-backend
      - name: Build and start the API
        working-directory: backend
        # API-only settings: kept off the job env so `next build/start` never sees PORT or NODE_ENV.
        env:
          DATABASE_URL: postgresql://cabinguard:cabinguard@127.0.0.1:5432/cabinguard_e2e
          NODE_ENV: test
          PORT: "4000"
          LOG_LEVEL: warn
          CORS_ORIGINS: http://localhost:3000
          FRONTEND_URL: http://localhost:3000
          COOKIE_SECURE: "false"
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: "1025"
          MAIL_FROM: CabinGuard <no-reply@cabinguard.test>
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/cabinguard-uploads
          SAFETY_WORKER_ENABLED: "false"
        run: |
          npm run build
          npm run prisma:migrate:deploy
          printf '%s' "$ADMIN_PASSWORD" | node dist/cli.js admin:create \
            --email "$ADMIN_EMAIL" --first-name E2E --last-name Admin --password-stdin
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS "$API_URL/health" >/dev/null && break; sleep 1; done
          curl -fsS "$API_URL/health" >/dev/null || { cat "$RUNNER_TEMP/api.log"; exit 1; }

      - uses: ./.github/actions/setup-frontend
      - name: Build and start the web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
        run: |
          pnpm --filter web build
          nohup pnpm --filter web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS "$WEB_URL/sign-in" >/dev/null && break; sleep 1; done
          curl -fsS "$WEB_URL/sign-in" >/dev/null || { cat "$RUNNER_TEMP/web.log"; exit 1; }

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Chromium
        working-directory: frontend/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend/apps/web
        run: pnpm test:e2e

      - name: Collect server logs
        if: failure()
        run: cp "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" frontend/apps/web/test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report/
            frontend/apps/web/test-results/
          retention-days: 14

  ci-success:
    name: CI success
    # The single check to mark as required: green only when every job that ran passed.
    if: always()
    needs: [backend, frontend, mobile, e2e-playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job ended with '$result'"; exit 1 ;;
            esac
          done
