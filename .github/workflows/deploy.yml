name: Deploy

# Continuous delivery to the production VM (Azure), once the images of a
# commit on main were built, scanned and published by containers.yml.
#
#   release  resolve the commit's images to digests (and verify their
#            signatures when the repository is public)
#   deploy   environment "production" (main only), sign in to Azure with
#            OIDC (no stored Azure secret), run deploy/deploy.sh on the VM
#            through Run Command (no SSH): pull, migrate, start, health
#            check, automatic rollback; then check the live sites from
#            outside: TLS, HTTP redirect, health, security headers
#
# Who decides to deploy: by default a person, by starting this workflow (the
# plan of a private organisation repository has no "required reviewers").
# With the repository variable AUTO_DEPLOY=true, containers.yml calls this
# workflow after every green build of main; pair it with required reviewers on
# the environment when the plan offers them.
#
# Manual run: gh workflow run deploy.yml            (the latest images built from main)
#             gh workflow run deploy.yml -f version=sha-1a2b3c4

on:
  workflow_call: # from containers.yml (AUTO_DEPLOY=true), with the caller's commit
    inputs:
      version:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy (sha-xxxxxxx). Empty = the latest images built from main.
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      backend: ${{ steps.digests.outputs.backend }}
      migrate: ${{ steps.digests.outputs.migrate }}
      web: ${{ steps.digests.outputs.web }}
    steps:
      - name: Release to deploy
        id: release
        env:
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          sha="$GITHUB_SHA"
          # Called after a build: that commit's images. Started by hand: the
          # latest images built from main (a docs-only commit has none).
          if [ "$EVENT" = workflow_dispatch ]; then default=main; else default="sha-${sha::7}"; fi
          tag="${VERSION:-$default}"
          [[ "$tag" =~ ^(main|sha-[0-9a-f]{7})$ ]] || { echo "::error::invalid version '$tag'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag (deploy files from $sha)"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the images to digests
        id: digests
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          for name in backend migrate web; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/cabinguard-$name:$TAG" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$digest" == sha256:* ]] || { echo "::error::no image cabinguard-$name:$TAG"; exit 1; }
            echo "$name=$REGISTRY/cabinguard-$name@$digest" >> "$GITHUB_OUTPUT"
            echo "cabinguard-$name:$TAG -> $digest"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: features
        uses: ./.github/actions/repo-features
        with:
          ghas-enabled: ${{ vars.GHAS_ENABLED }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.features.outputs.public == 'true'
      - name: Verify the image signatures
        if: steps.features.outputs.public == 'true'
        env:
          IMAGES: >-
            ${{ steps.digests.outputs.backend }}
            ${{ steps.digests.outputs.migrate }}
            ${{ steps.digests.outputs.web }}
        run: |
          for ref in $IMAGES; do
            cosign verify "$ref" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "signature verified: $ref"
          done

  deploy:
    name: Deploy to production
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deployment at a time, never cancelled half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    permissions:
      contents: read
      packages: read # the VM pulls with this job's short-lived token
      id-token: write # OIDC sign-in to Azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run deploy.sh on the VM
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_VM_NAME }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          RELEASE: ${{ needs.release.outputs.tag }}
          BACKEND_IMAGE: ${{ needs.release.outputs.backend }}
          MIGRATE_IMAGE: ${{ needs.release.outputs.migrate }}
          WEB_IMAGE: ${{ needs.release.outputs.web }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          DEVICE_ENCRYPTION_KEY: ${{ secrets.DEVICE_ENCRYPTION_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          set -euo pipefail
          for name in RG VM APP_DOMAIN API_DOMAIN POSTGRES_PASSWORD JWT_ACCESS_SECRET TOKEN_HASH_SECRET MFA_ENCRYPTION_KEY MAIL_USER MAIL_PASSWORD MAIL_FROM; do
            [ -n "${!name}" ] || { echo "::error::$name is not set in the production environment"; exit 1; }
          done
          # Goes into a URL: keep it URL-safe (generate with: openssl rand -hex 32).
          [[ "$POSTGRES_PASSWORD" =~ ^[A-Za-z0-9]+$ ]] \
            || { echo "::error::POSTGRES_PASSWORD must be alphanumeric (openssl rand -hex 32)"; exit 1; }

          # The application configuration, in memory only, sent as a protected parameter.
          env_b64=$(cat <<EOF | base64 -w0
          NODE_ENV=production
          PORT=4000
          LOG_LEVEL=info
          TRUST_PROXY=1
          CORS_ORIGINS=https://$APP_DOMAIN
          FRONTEND_URL=https://$APP_DOMAIN
          API_PUBLIC_URL=https://$API_DOMAIN
          SWAGGER_ENABLED=false
          COOKIE_SECURE=true
          COOKIE_SAME_SITE=strict
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          DATABASE_URL=postgresql://cabinguard:$POSTGRES_PASSWORD@postgres:5432/cabinguard
          JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
          TOKEN_HASH_SECRET=$TOKEN_HASH_SECRET
          WEB_SESSION_IDLE_TTL_SECONDS=1800
          MFA_ENCRYPTION_KEY=$MFA_ENCRYPTION_KEY
          ${DEVICE_ENCRYPTION_KEY:+DEVICE_ENCRYPTION_KEY=$DEVICE_ENCRYPTION_KEY}
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_SECURE=false
          MAIL_USER=$MAIL_USER
          MAIL_PASSWORD=$MAIL_PASSWORD
          MAIL_FROM="$MAIL_FROM"
          STORAGE_DRIVER=local
          STORAGE_LOCAL_IN_PRODUCTION=true
          SAFETY_WORKER_ENABLED=true
          EOF
          )
          bundle_b64=$(tar -czf - -C deploy compose.prod.yaml Caddyfile | base64 -w0)

          name="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Running $name on $VM (release $RELEASE)"
          status=0
          az vm run-command create -g "$RG" --vm-name "$VM" --name "$name" \
            --script @deploy/deploy.sh \
            --timeout-in-seconds 1500 --async-execution false --output none \
            --parameters "RELEASE=$RELEASE" "BACKEND_IMAGE=$BACKEND_IMAGE" \
              "MIGRATE_IMAGE=$MIGRATE_IMAGE" "WEB_IMAGE=$WEB_IMAGE" \
              "APP_DOMAIN=$APP_DOMAIN" "API_DOMAIN=$API_DOMAIN" \
              "GHCR_USER=$GITHUB_ACTOR" "BUNDLE_B64=$bundle_b64" \
            --protected-parameters "ENV_B64=$env_b64" "GHCR_TOKEN=$GHCR_TOKEN" || status=$?

          view=$(az vm run-command show -g "$RG" --vm-name "$VM" --name "$name" \
            --expand instanceView --query instanceView -o json)
          az vm run-command delete -g "$RG" --vm-name "$VM" --name "$name" --yes --output none || true

          echo "$view" | jq -r '.output // ""'
          echo "$view" | jq -r '.error // ""' >&2
          code=$(echo "$view" | jq -r '.exitCode // 1')
          state=$(echo "$view" | jq -r '.executionState // "unknown"')
          {
            echo "### Deployment of \`$RELEASE\`"
            echo "- VM: \`$VM\` · state: \`$state\` · exit code: \`$code\`"
            echo "- API: \`$BACKEND_IMAGE\`"
            echo "- Web: \`$WEB_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || [ "$code" != 0 ] || [ "$state" != Succeeded ]; then
            echo "::error::deployment failed (state $state, exit code $code)"
            exit 1
          fi

      # From outside, as a visitor: valid TLS, redirect, health, headers.
      - name: Verify the live sites (TLS, health, security headers)
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          set -euo pipefail
          check() { grep -qi "^$1" "$2" || { echo "::error::$3"; exit 1; }; }

          # curl verifies the certificate: an invalid TLS setup fails here.
          curl -fsS "https://$API_DOMAIN/api/v1/health" -D api.h -o health.json
          jq -e '.data.status == "ok" and .data.database == "up"' health.json >/dev/null \
            || { echo "::error::unhealthy API: $(cat health.json)"; exit 1; }
          curl -fsS "https://$APP_DOMAIN/sign-in" -D app.h -o /dev/null
          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://$APP_DOMAIN/")
          [[ "$redirect" =~ ^30[178]\ https:// ]] \
            || { echo "::error::HTTP is not redirected to HTTPS ($redirect)"; exit 1; }

          for h in api.h app.h; do
            check "strict-transport-security:" $h "HSTS missing ($h)"
            check "content-security-policy:" $h "CSP missing ($h)"
            check "x-content-type-options: nosniff" $h "nosniff missing ($h)"
            ! grep -qi "^x-powered-by:" $h || { echo "::error::X-Powered-By leaked ($h)"; exit 1; }
            ! grep -qi "^server:" $h || { echo "::error::Server header leaked ($h)"; exit 1; }
          done
          {
            echo "### Live checks"
            echo "- https://$APP_DOMAIN and https://$API_DOMAIN: valid TLS, HTTP redirected"
            echo "- API health: OK"
            echo "- HSTS, CSP, nosniff present; no X-Powered-By or Server header"
          } >> "$GITHUB_STEP_SUMMARY"
