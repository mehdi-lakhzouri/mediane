# CabinGuard production stack, on one VM. Deployed by .github/workflows/deploy.yml
# through deploy/deploy.sh into /opt/cabinguard; never edited by hand there.
#
#   .env          application configuration and secrets (written by the deploy, mode 600)
#   release.env   image references pinned by digest (what was scanned and signed)
#
# Only Caddy publishes ports. PostgreSQL sits on an internal network with no
# route out; the API reaches it there and reaches the Internet (SMTP) through
# the edge network.

name: cabinguard

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: local
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    <<: *hardened
    image: caddy:2.11@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and ACME account: keep across deploys
      - caddy-config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    environment:
      POSTGRES_DB: cabinguard
      POSTGRES_USER: cabinguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinguard -d cabinguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *hardened
    image: ${MIGRATE_IMAGE:?}
    restart: "no"
    env_file: .env
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [migrate] # run on purpose by deploy.sh, before the API

  api:
    <<: *hardened
    image: ${BACKEND_IMAGE:?}
    env_file: .env
    environment:
      STORAGE_LOCAL_DIR: /data/uploads
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - uploads:/data/uploads
    networks: [edge, data]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *hardened
    image: ${WEB_IMAGE:?}
    networks: [edge]

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  edge:
  data:
    internal: true
