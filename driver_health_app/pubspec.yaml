name: driver_health_app
description: Mediane mobile application for driver safety and family alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  animations: ^3.0.0
  app_links: ^7.2.2
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  formz: ^0.8.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  image_cropper: ^12.2.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  logging: ^1.3.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: '#031222'
  image: assets/images/mediane-splash.png
  color_dark: '#031222'
  image_dark: assets/images/mediane-splash.png
  android_12:
    color: '#031222'
    image: assets/images/mediane-app-icon.png
    icon_background_color: '#031222'
  web: true
